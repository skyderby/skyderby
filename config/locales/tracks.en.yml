        first_drop: Horizontal distance covered over the first %{drop} of altitude loss, measured along the flown trajectory.
        glide: Horizontal distance divided by altitude lost between the 10th second and deployment, measured along the trajectory rather than averaged from instant readings. Bars show how long you held each glide band.
        speed: Trajectory length divided by time between the 10th second and deployment. Bars show how long you held each speed band.
