test:
  service: Disk
  root: <%= Rails.root.join('tmp/storage') %>

local:
  service: Disk
  root: <%= Rails.root.join('storage') %>

amazon:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) || ENV.fetch('AWS_ACCESS_KEY_ID', nil) %>
  secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) || ENV.fetch('AWS_SECRET_ACCESS_KEY', nil) %>
  region: <%= Rails.application.credentials.dig(:aws, :region) || ENV.fetch('AWS_REGION', nil) %>
  bucket: <%= Rails.application.credentials.dig(:aws, :shrine_bucket) || ENV.fetch('SHRINE_S3_BUCKET', nil) %>

r2:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:r2, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:r2, :secret_access_key) %>
  bucket: <%= Rails.application.credentials.dig(:r2, :bucket) %>
  endpoint: <%= Rails.application.credentials.dig(:r2, :endpoint) %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

amazon_to_r2:
  service: Mirror
  primary: amazon
  mirrors:
    - r2
